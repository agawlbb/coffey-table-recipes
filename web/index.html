<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Household recipes, meal planning, and cooking.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Coffey Table Recipes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Coffey Table Recipes</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Keep a visible fallback while Flutter initializes or between controls. */
    html, body { cursor: default; }
    #reload-app {
      position: fixed; right: 12px; bottom: 12px; z-index: 10000;
      padding: 8px 12px; border: 1px solid #6b7050; border-radius: 6px;
      background: #fff; color: #333; font: 14px system-ui; cursor: pointer;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <button id="reload-app" type="button" title="Reload the latest development build">Reload app</button>
  <script>
    const appBase = new URL(document.querySelector('base').href);
    async function removeOldWorker() {
      if (!('serviceWorker' in navigator)) return false;
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (const registration of registrations) {
        const worker = registration.active || registration.waiting || registration.installing;
        if (registration.scope === appBase.href && worker &&
            new URL(worker.scriptURL).pathname === new URL('flutter_service_worker.js', appBase).pathname) {
          await registration.unregister();
        }
      }
      const controller = navigator.serviceWorker.controller;
      return controller && new URL(controller.scriptURL).pathname ===
        new URL('flutter_service_worker.js', appBase).pathname;
    }
    document.getElementById('reload-app').addEventListener('click', async () => {
      await removeOldWorker().catch(() => false);
      const url = new URL(location.href);
      url.searchParams.set('dev_reload', Date.now());
      location.replace(url.href);
    });
    (async () => {
      // A previous offline build may still control this page until navigation.
      if (await removeOldWorker().catch(() => false)) {
        location.reload();
        return;
      }
      const script = document.createElement('script');
      script.src = new URL('flutter_bootstrap.js?dev=' + Date.now(), appBase).href;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
