name: Publish iOS universal link association
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  association:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m pip install requests==2.32.5
      - name: Preserve other apps and publish verified iOS association
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: python3 tool/publish-ios-association.py
