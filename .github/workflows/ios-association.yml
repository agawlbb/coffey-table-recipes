name: Verify VPS iOS universal link association
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  association:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify VPS association against the signing identity
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: python3 tool/publish-ios-association.py
