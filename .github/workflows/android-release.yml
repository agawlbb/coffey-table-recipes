name: Build signed Android release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag, or commit SHA for an account test
        required: true
        type: string
      test_build:
        description: Build an account-test APK from the supplied immutable commit
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require a release tag and existing signing credentials
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TEST_BUILD: ${{ inputs.test_build }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [[ "$TEST_BUILD" == true ]]; then
            [[ "$RELEASE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo 'Test builds require an immutable commit SHA'; exit 1; }
          else
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          fi
          test -n "$ANDROID_KEYSTORE"
          test -n "$FIREBASE_CONFIG"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          java -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' > /dev/null
      - name: Restore existing Android identity and private configuration
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_JSON }}
          TEST_BUILD: ${{ inputs.test_build }}
        run: |
          umask 077
          mkdir -p "$HOME/.gradle"
          python3 - <<'PY'
          import base64, hashlib, json, os, re, ssl, subprocess
          from pathlib import Path
          config = json.loads(os.environ['FIREBASE_CONFIG'])
          required = ['FIREBASE_ANDROID_APP_ID', 'FIREBASE_ANDROID_API_KEY', 'FIREBASE_SENDER_ID', 'FIREBASE_PROJECT_ID']
          assert all(config.get(key) for key in required), 'Firebase configuration lacks required Android fields'
          keystore = Path(os.environ['RUNNER_TEMP'], 'android-original.keystore')
          keystore.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE'], validate=True))
          public = subprocess.check_output(['keytool', '-exportcert', '-rfc', '-keystore', str(keystore), '-storepass', 'android', '-alias', 'androiddebugkey'], text=True, stderr=subprocess.DEVNULL)
          certificate = re.search(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', public, re.S)[0]
          assert hashlib.sha256(ssl.PEM_cert_to_DER_cert(certificate)).hexdigest() == 'f8de933f14b9bb4b3191a94aedc8637972c5ab224565f6abd7808f8038d12097', 'Stored Android signing identity mismatch'
          Path(os.environ['RUNNER_TEMP'], 'firebase.json').write_text(os.environ['FIREBASE_CONFIG'])
          version, build = re.search(r'^version: (\d+\.\d+\.\d+)\+(\d+)', Path('pubspec.yaml').read_text(), re.M).groups()
          if os.environ['TEST_BUILD'] == 'true':
              version += '-account-test'
              build = str(int(build) + 1)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'APK_VERSION={version}\nAPK_BUILD={build}\n')
          PY
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          EOF
      # This Flutter version regenerates release-only plugin registration during pub.
      - run: flutter build apk --release --dart-define-from-file="$RUNNER_TEMP/firebase.json" --build-name="$APK_VERSION" --build-number="$APK_BUILD"
      - name: Sign explicitly with the original distribution identity
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/android-original.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out "$RUNNER_TEMP/signed-release.apk" "$apk"
          mv "$RUNNER_TEMP/signed-release.apk" "$apk"
      - name: Verify signed package, version, provenance and hosted app links
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TEST_BUILD: ${{ inputs.test_build }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, ssl, subprocess
          from pathlib import Path
          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          tools = Path(os.environ['ANDROID_HOME'], 'build-tools', '36.0.0')
          signature = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--print-certs-pem', str(apk)], text=True)
          certificates = re.findall(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', signature, re.S)
          assert len(certificates) == 1, 'Expected one APK signing certificate'
          fingerprint = hashlib.sha256(ssl.PEM_cert_to_DER_cert(certificates[0])).hexdigest()
          assert fingerprint == 'f8de933f14b9bb4b3191a94aedc8637972c5ab224565f6abd7808f8038d12097', 'Unexpected signing identity'
          version, build = re.search(r'^version: (\d+\.\d+\.\d+)\+(\d+)', Path('pubspec.yaml').read_text(), re.M).groups()
          test_build = os.environ['TEST_BUILD'] == 'true'
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if test_build:
              assert os.environ['RELEASE_TAG'] == source, 'Test source mismatch'
              version += '-account-test'
              build = str(int(build) + 1)
          else:
              assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag/version mismatch'
          badging = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging)
          assert package and package.groups() == ('com.coffeytable.coffey_table_recipes', build, version), 'Package/version mismatch'
          assert 'application-debuggable' not in badging, 'Release must not be debuggable'
          subprocess.run(['python3', 'tool/verify-app-links.py', '--fingerprint', fingerprint], check=True)
          output = Path('build/android-delivery')
          output.mkdir(parents=True, exist_ok=True)
          filename = f'CoffeyTableRecipes-{version}-build{build}.apk'
          shutil.copyfile(apk, output / filename)
          report = dict(version=version, build=int(build), tag=os.environ['RELEASE_TAG'], test_build=test_build,
                        source=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                        filename=filename, sha256=hashlib.sha256(apk.read_bytes()).hexdigest(), certificate_sha256=fingerprint)
          (output / 'verification.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Save verified APK for Google Drive publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CoffeyTableRecipes-Android-${{ inputs.release_tag }}
          path: build/android-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed-verification APK for inspection
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CoffeyTableRecipes-Android-unverified-${{ inputs.release_tag }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
          retention-days: 1
      - name: Remove temporary private files
        if: always()
        run: rm -f "$RUNNER_TEMP/android-original.keystore" "$RUNNER_TEMP/firebase.json"
