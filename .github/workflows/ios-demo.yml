name: iOS demonstration IPA
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (leave empty to build the selected workflow branch)
        required: false
        type: string
      build_number:
        description: Optional iOS build number override
        required: false
        type: string
      simulator_only:
        description: Test the share extension in an iPhone simulator instead of packaging an IPA
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ios:
    if: ${{ !inputs.simulator_only }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Validate manually selected build
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Provide a versioned release tag'; exit 1; }
          fi
          if [[ -n "$IOS_BUILD_NUMBER" ]]; then
            [[ "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'Provide a positive numeric build number'; exit 1; }
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Select Xcode with iOS 27 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          xcodebuild -version
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore private Firebase build configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          test -n "$FIREBASE_CONFIG" || { echo 'FIREBASE_CONFIG_JSON repository secret is required'; exit 1; }
          printf '%s' "$FIREBASE_CONFIG" > "$RUNNER_TEMP/firebase.json"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Validate iOS share configuration
        run: |
          # Normalize build ordering for immutable releases created before this correction.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = path.read_text()
          thin = '\t\t\t\t3B06AD1E1E4923F5004D2608 /* Thin Binary */,\n'
          embed = '\t\t\t\t7FEAB63A8052A2CE3F548F05,\n'
          text = text.replace(thin + embed, embed + thin)
          assert embed + thin in text, 'Unexpected Runner extension build ordering'
          path.write_text(text)
          PY
          python3 -m unittest discover -s tool -p test_configure_ios.py
          plutil -lint ios/Runner/Info.plist ios/ShareExtension/Info.plist ios/Runner/Runner.entitlements ios/ShareExtension/ShareExtension.entitlements ios/Runner.xcodeproj/project.pbxproj
      - name: Configure iOS Google sign-in callback
        run: python3 tool/configure-ios.py "$RUNNER_TEMP/firebase.json"
      - name: Build unsigned iOS app
        env:
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          args=()
          if [[ -n "$IOS_BUILD_NUMBER" ]]; then args+=("--build-number=$IOS_BUILD_NUMBER"); fi
          flutter build ios --release --no-codesign --dart-define-from-file="$RUNNER_TEMP/firebase.json" "${args[@]}"
      - name: Package unsigned IPA for inspection
        run: |
          mkdir -p build/ios/package/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/package/Payload/
          cd build/ios/package
          zip -qry ../CoffeyTableRecipes-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CoffeyTableRecipes-iOS-unsigned-${{ inputs.release_tag || github.sha }}
          path: build/ios/CoffeyTableRecipes-unsigned.ipa
          retention-days: 30
  simulator:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulator_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runtime: '26'
            xcode: '26.3'
          - runner: xcode-27
            runtime: '27'
            xcode: default
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: |
          if [[ "$XCODE_VERSION" != default ]]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          fi
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Firebase client build configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          test -n "$FIREBASE_CONFIG"
          printf '%s' "$FIREBASE_CONFIG" > "$RUNNER_TEMP/firebase.json"
      - run: flutter pub get
      - name: Configure main app sign-in
        run: python3 tool/configure-ios.py "$RUNNER_TEMP/firebase.json"
      - name: Build simulator app and embedded extension
        run: flutter build ios --simulator --debug --no-codesign --dart-define-from-file="$RUNNER_TEMP/firebase.json"
      - name: Replace simulator extension with Release compilation
        run: |
          xcodebuild build -project ios/Runner.xcodeproj -target ShareExtension \
            -configuration Release -sdk iphonesimulator ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO FLUTTER_BUILD_NAME=1.1.1 FLUTTER_BUILD_NUMBER=10 \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/release-extension"
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          target = Path('build/ios/iphonesimulator/Runner.app/PlugIns/ShareExtension.appex')
          assert target.resolve().is_relative_to(Path('build').resolve())
          shutil.rmtree(target)
          shutil.copytree(Path(os.environ['RUNNER_TEMP']) / 'release-extension/ShareExtension.appex', target)
          PY
      - name: Select extension from real PDF and text share sheets
        env:
          IOS_RUNTIME_MAJOR: ${{ matrix.runtime }}
        run: bash tool/test-ios-share-simulator.sh
      - name: Save simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-share-simulator-${{ matrix.runtime }}-release-${{ github.sha }}
          path: |
            build/ios-share-probe/*.png
            build/ios-share-probe/*.log
            build/ios-share-probe/results.xcresult
            build/ios-share-probe/screenshots
            build/ios-share-probe/crashes
          if-no-files-found: warn
          retention-days: 14
