name: iOS demonstration IPA
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild with the current workflow
        required: true
        type: string
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Validate manually selected release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Provide a versioned release tag'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Select Xcode with iOS 26 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore private Firebase build configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          test -n "$FIREBASE_CONFIG" || { echo 'FIREBASE_CONFIG_JSON repository secret is required'; exit 1; }
          printf '%s' "$FIREBASE_CONFIG" > "$RUNNER_TEMP/firebase.json"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Validate iOS share configuration
        run: |
          # Normalize build ordering for immutable releases created before this correction.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = path.read_text()
          thin = '\t\t\t\t3B06AD1E1E4923F5004D2608 /* Thin Binary */,\n'
          embed = '\t\t\t\t7FEAB63A8052A2CE3F548F05,\n'
          text = text.replace(thin + embed, embed + thin)
          assert embed + thin in text, 'Unexpected Runner extension build ordering'
          path.write_text(text)
          PY
          python3 -m unittest discover -s tool -p test_configure_ios.py
          node --test tool/test_share_extension.cjs
          plutil -lint ios/Runner/Info.plist ios/ShareExtension/Info.plist ios/Runner/Runner.entitlements ios/ShareExtension/ShareExtension.entitlements ios/Runner.xcodeproj/project.pbxproj
      - name: Configure iOS Google sign-in callback
        run: python3 tool/configure-ios.py "$RUNNER_TEMP/firebase.json"
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define-from-file="$RUNNER_TEMP/firebase.json"
      - name: Package IPA for later Sideloadly signing
        run: |
          mkdir -p build/ios/package/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/package/Payload/
          cd build/ios/package
          zip -qry ../CoffeyTableRecipes-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CoffeyTableRecipes-iOS-unsigned-${{ inputs.release_tag || github.ref_name }}
          path: build/ios/CoffeyTableRecipes-unsigned.ipa
          retention-days: 30
