name: Deploy hosted website
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected release after validation (leave false to validate the deployment client only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hosted-web
  cancel-in-progress: false
jobs:
  validate-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the isolated deployment trust store without hosting access
        run: |
          python3 -m venv "$RUNNER_TEMP/deploy-venv"
          "$RUNNER_TEMP/deploy-venv/bin/python" -m pip install -r tool/requirements-deploy.txt
          "$RUNNER_TEMP/deploy-venv/bin/python" -m pip check
          "$RUNNER_TEMP/deploy-venv/bin/python" tool/test_deploy_web.py
          "$RUNNER_TEMP/deploy-venv/bin/python" -c 'import certifi, hashlib; from pathlib import Path; bundle = Path(certifi.where()); print("certifi", certifi.__version__, "CA bundle SHA256", hashlib.sha256(bundle.read_bytes()).hexdigest())'
  deploy:
    needs: validate-client
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a release tag
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Select a versioned release tag for deployment'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require verified Android domain association
        run: python3 tool/verify-app-links.py
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Firebase build configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          test -n "$FIREBASE_CONFIG"
          printf '%s' "$FIREBASE_CONFIG" > "$RUNNER_TEMP/firebase.json"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --base-href=/CoffeyTableRecipes/app/ --dart-define-from-file="$RUNNER_TEMP/firebase.json"
      - run: python3 tool/prepare-web.py
      - name: Install isolated deployment client and patched CA bundle
        run: |
          python3 -m venv "$RUNNER_TEMP/deploy-venv"
          "$RUNNER_TEMP/deploy-venv/bin/python" -m pip install -r tool/requirements-deploy.txt
          "$RUNNER_TEMP/deploy-venv/bin/python" -m pip check
      - run: '"$RUNNER_TEMP/deploy-venv/bin/python" tool/test_deploy_web.py'
      - name: Publish and verify hosted website
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: '"$RUNNER_TEMP/deploy-venv/bin/python" tool/deploy-web.py'
